services:
  mongo:
    image: siddharth67/mongo-db:non-prod
    container_name: solar-mongo
    restart: unless-stopped

  app:
    image: tienbibug/solar-system:${IMAGE_TAG}
    container_name: solar-system
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
