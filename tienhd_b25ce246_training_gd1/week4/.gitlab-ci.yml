workflow:
  name: Solar System NodeJS Pipeline
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - deploy-dev
  - deploy-prod

variables:
  DOCKER_USERNAME: tienbibug
  DOCKER_REPO: tienbibug/solar-system
  IMAGE_TAG: $CI_PIPELINE_ID
  EC2_HOST_DEV: 47.131.139.243
  EC2_HOST_PROD: 47.131.245.182


unit_testing:
  stage: test
  image: node:18-alpine3.17
  services:
    - name: siddharth67/mongo-db:non-prod
      alias: mongo
      pull_policy: always
  variables:
    MONGO_URI: mongodb://mongo:27017/superData
    MONGO_USERNAME: non-prod-user
    MONGO_PASSWORD: non-prod-password
  cache:
    key:
      files:
        - package-lock.json
      prefix: node_modules
    policy: pull-push
    when: on_success
    paths:
      - node_modules
  before_script:
    - npm install
  script:
    - npm test
  artifacts:
    when: always
    expire_in: 3 days
    name: Mocha-Test-Result
    paths:
      - test-results.xml
    reports:
      junit: test-results.xml

code_coverage:
  stage: test
  image: node:18-alpine3.17
  services:
    - name: siddharth67/mongo-db:non-prod
      alias: mongo
      pull_policy: always
  variables:
    MONGO_URI: mongodb://mongo:27017/superData
    MONGO_USERNAME: non-prod-user
    MONGO_PASSWORD: non-prod-password
  cache:
    key:
      files:
        - package-lock.json
      prefix: node_modules
    policy: pull
    when: on_success
    paths:
      - node_modules
  before_script:
    - npm install
  script:
    - npm run coverage
  artifacts:
    name: Code-Coverage-Result
    when: always
    expire_in: 3 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  coverage: /All files[^|]*\|[^|]*\s+([0-9.]+)/
  allow_failure: true

build_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - unit_testing
    - code_coverage
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t "$DOCKER_REPO:$IMAGE_TAG" .
    - docker push "$DOCKER_REPO:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^feature/

deploy_dev:
  stage: deploy-dev
  image: alpine:3.19
  needs:
    - build_image
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY_DEV" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -lf ~/.ssh/id_ed25519
    - ssh-keyscan -H "$EC2_HOST_DEV" >> ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/id_ed25519 "ubuntu@$EC2_HOST_DEV" "cd /opt/solar-system && export IMAGE_TAG=$IMAGE_TAG && docker compose pull app && docker compose up -d app"
  environment:
    name: development
    url: http://$EC2_HOST_DEV
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^feature/

smoke_dev:
  stage: deploy-dev
  image: curlimages/curl:8.10.1
  needs:
    - deploy_dev
  script:
    - |
      for i in $(seq 1 20); do
        if curl -fsS "http://$EC2_HOST_DEV/live"; then break; fi
        sleep 3
      done
      curl -fsS "http://$EC2_HOST_DEV/ready"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^feature/

deploy_prod:
  stage: deploy-prod
  image: alpine:3.19
  needs:
    - deploy_dev
  when: manual
  resource_group: production
  environment:
    name: production
    url: http://$EC2_HOST_PROD
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY_PROD" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -lf ~/.ssh/id_ed25519
    - ssh-keyscan -H "$EC2_HOST_PROD" >> ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/id_ed25519 "ubuntu@$EC2_HOST_PROD" "cd /opt/solar-system && export IMAGE_TAG=$IMAGE_TAG && docker compose pull app && docker compose up -d app"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

smoke_prod:
  stage: deploy-prod
  image: curlimages/curl:8.10.1
  needs:
    - deploy_prod
  script:
    - |
      for i in $(seq 1 20); do
        if curl -fsS "http://$EC2_HOST_PROD/live"; then break; fi
        sleep 3
      done
      curl -fsS "http://$EC2_HOST_PROD/ready"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

rollback_prod:
  stage: deploy-prod
  image: alpine:3.19
  when: manual
  resource_group: production
  needs:
    - deploy_dev
  inputs:
    ROLLBACK_TAG:
      description: "Image tag to roll back to (IMAGE_TAG of a previous pipeline)"
      type: string
      default: ""
      regex: '^[A-Za-z0-9._-]*$'
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY_PROD" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -lf ~/.ssh/id_ed25519
    - ssh-keyscan -H "$EC2_HOST_PROD" >> ~/.ssh/known_hosts
  script:
    - test -n "${{ job.inputs.ROLLBACK_TAG }}"
    - ssh -i ~/.ssh/id_ed25519 "ubuntu@$EC2_HOST_PROD" "cd /opt/solar-system && export IMAGE_TAG=${{ job.inputs.ROLLBACK_TAG }} && docker compose pull app && docker compose up -d app"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
